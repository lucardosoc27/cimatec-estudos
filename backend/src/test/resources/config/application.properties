# Só para os testes: o banco vai para a memória, e ./mvnw test nunca abre backend/dados/.
# Sem isto, teste que não troca o datasource usaria o banco de desenvolvimento: mexeria no
# esquema dele e falharia com o servidor rodando, porque o H2 em arquivo tranca o arquivo.
#
# Fica em config/ de propósito. O Spring Boot lê classpath:/application.properties E
# classpath:/config/application.properties, e o segundo vence o primeiro só nas propriedades
# que ele repete. Um application.properties direto em src/test/resources esconderia o do main
# inteiro, e os testes perderiam todas as outras configurações.
spring.datasource.url=jdbc:h2:mem:testes-padrao;DB_CLOSE_DELAY=-1
