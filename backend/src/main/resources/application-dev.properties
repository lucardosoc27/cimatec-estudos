# Perfil de desenvolvimento, ligado pelo ./mvnw spring-boot:run (pom.xml). Versionado de
# propósito: não tem segredo, e o servidor local precisa dele. Só o que é de desenvolvimento
# fica aqui; o application.properties traz os valores de produção.

# O site local é o ng serve.
app.url=http://localhost:4200

# Domínio de demonstração, claramente fictício (ESPECIFICACAO-TELAS.md: não inventar o do CIMATEC).
app.email.dominio=exemplo.com

# Cookie de sessão sem Secure: o desenvolvimento é em http, e fora de http://localhost (um celular
# acessando pelo IP da máquina, na apresentação) o navegador descartaria um cookie Secure.
server.servlet.session.cookie.secure=false

# Em desenvolvimento, o único proxy é o ng serve, na mesma máquina. Por padrão o Tomcat
# confiaria no X-Forwarded-For de qualquer faixa privada, e o Spring escuta na rede local:
# um aparelho do mesmo Wi-Fi escreveria o IP que quisesse. Aqui só a própria máquina é proxy.
server.tomcat.remoteip.internal-proxies=127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1
