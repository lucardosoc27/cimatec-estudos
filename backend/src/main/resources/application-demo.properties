# Perfil de DEMONSTRAÇÃO: o servidor público no Render, para a banca e para o professor verem o
# sistema sem o notebook do autor. NÃO é produção, e é separado do dev (DECISOES.md, 2026-09-27,
# "Perfil demo"). Liga-se com a variável SPRING_PROFILES_ACTIVE=demo (a imagem Docker já traz).
#
# O que vem de application.properties e continua valendo aqui: cookie de sessão Secure (o Render
# serve HTTPS), forward headers em modo native, a porta pela variável PORT, o banco H2 em arquivo,
# os limites por conta e por origem, e o Angular servido de dentro do jar.
#
# O que este perfil muda: só o que é próprio da demonstração.

# Entrega do link de verificação: a classe LinkNoConsole também existe neste perfil e escreve o
# link, com o token, no log da aplicação, que se lê no painel do Render. Envio de e-mail continua
# fora do escopo. Consequência declarada: quem lê o log ativa qualquer conta.

# Domínio dos e-mails de demonstração, claramente fictício (a especificação proíbe inventar o do
# CIMATEC). É por isso que este ambiente não pode ser chamado de produção: qualquer @exemplo.com
# consegue se cadastrar.
app.email.dominio=exemplo.com

# Endereço público do site, que entra no link de verificação. Vem de APP_URL; se ela não existir,
# do RENDER_EXTERNAL_URL, que o Render define sozinho para todo web service
# (https://<nome-do-serviço>.onrender.com). Sem nenhum dos dois o servidor não sobe.
app.url=${APP_URL:${RENDER_EXTERNAL_URL}}
