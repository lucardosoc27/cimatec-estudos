spring.application.name=backend

# H2 em modo ARQUIVO: o usuário cadastrado sobrevive a um restart (em memória, sumiria).
# O caminho é relativo à pasta onde o Spring sobe, então o banco fica em backend/dados/,
# que está no .gitignore. O console web do H2 nem está no projeto (dependência removida).
# Sem senha: o arquivo é local e de desenvolvimento. Em produção, a senha viria de variável de ambiente.
spring.datasource.url=jdbc:h2:file:./dados/cimatec
spring.datasource.username=sa

# URL pública do site, usada para montar o link de verificação. Em desenvolvimento é o ng serve;
# em produção, o domínio onde Angular e API ficam juntos (variável de ambiente APP_URL).
app.url=http://localhost:4200

# Hibernate cria e atualiza as tabelas a partir das entidades ao subir. Com H2 em arquivo o
# Boot NÃO faz isso sozinho (só faria com banco em memória). Sem ferramenta de migração
# (Flyway) nesta etapa: seria uma dependência a mais para defender, e o banco é local.
spring.jpa.hibernate.ddl-auto=update
# A sessão do JPA fecha ao sair do serviço, não no fim da resposta HTTP. Só evita o aviso do Boot.
spring.jpa.open-in-view=false

# Domínio aceito no cadastro. O domínio real do CIMATEC ainda não foi confirmado
# (ESPECIFICACAO-TELAS.md, "Login e cadastro"); as contas de demonstração usam @exemplo.com.
# Em produção vem da variável de ambiente APP_EMAIL_DOMINIO.
app.email.dominio=exemplo.com

# Verificação do e-mail: o link vale 24 horas (ESPECIFICACAO-TELAS.md, "Verificar e-mail") e
# só dá para pedir outro depois de 60 segundos. Formato de Duration: 24h, 60s, PT5M.
app.verificacao.validade=24h
app.verificacao.intervalo-reenvio=60s

# Cookie de sessão (JSESSIONID). HttpOnly: o JavaScript não lê o cookie, então um XSS não rouba
# a sessão. SameSite=Lax: o navegador não manda o cookie em POST vindo de outro site (segunda
# barreira contra CSRF, além do token; e como front e API ficam na mesma origem, toda chamada
# legítima parte do próprio site e o cookie sempre viaja nelas). Secure: só viaja por HTTPS;
# fica desligado em desenvolvimento local (http://localhost), senão o navegador não envia o
# cookie. Em produção, APP_COOKIE_SECURE=true. A sessão expira depois de 30 minutos sem uso; o
# logout é explícito.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Limite de tentativas de login (DECISOES.md, 2026-09-27). Por conta: 5 tentativas em 15 minutos.
# Por origem (IP): 20, mais folgado, porque em desenvolvimento todo mundo chega pelo proxy do
# ng serve com o mesmo IP. Passou do limite, bloqueia por 15 minutos e destrava sozinho.
app.login.limite-por-conta=5
app.login.limite-por-origem=20
app.login.janela=15m
app.login.bloqueio=15m
