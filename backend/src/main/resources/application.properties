spring.application.name=backend

# Porta: a variável PORT, que o provedor de hospedagem define (no Render, 10000). Sem ela, 8080.
server.port=${PORT:8080}

# H2 em modo ARQUIVO: o usuário cadastrado sobrevive a um restart (em memória, sumiria).
# A pasta vem da variável APP_BANCO_DIR; sem ela, ./dados relativo à pasta onde o Spring sobe,
# ou seja, backend/dados/, que está no .gitignore. Num servidor, a variável aponta para uma pasta
# gravável (a imagem Docker usa /app/dados; um disco persistente entraria aqui). O console web do
# H2 nem está no projeto (dependência removida). Sem senha: o arquivo é local. Em produção, a
# senha viria de variável de ambiente.
spring.datasource.url=jdbc:h2:file:${APP_BANCO_DIR:./dados}/cimatec
spring.datasource.username=sa

# Este arquivo traz os valores de PRODUÇÃO; o perfil dev (application-dev.properties, ligado pelo
# ./mvnw spring-boot:run) sobrescreve o que é de desenvolvimento. Assim, esquecer uma configuração
# em produção deixa o sistema seguro ou parado, nunca aberto (revisão de segurança, G4).

# URL pública do site, usada para montar o link de verificação: o domínio onde Angular e API
# ficam juntos. Sem valor padrão de propósito: sem a variável APP_URL o servidor não sobe, em vez
# de mandar links para um endereço errado.
app.url=${APP_URL}

# O Angular compilado é servido de static/ dentro do jar, com fallback para o index.html nas
# rotas do Angular (config/RotasDoAngular). O mapeamento padrão do Boot para /** fica desligado
# para existir um só.
spring.web.resources.add-mappings=false

# Hibernate cria e atualiza as tabelas a partir das entidades ao subir. Com H2 em arquivo o
# Boot NÃO faz isso sozinho (só faria com banco em memória). Sem ferramenta de migração
# (Flyway) nesta etapa: seria uma dependência a mais para defender, e o banco é local.
spring.jpa.hibernate.ddl-auto=update
# A sessão do JPA fecha ao sair do serviço, não no fim da resposta HTTP. Só evita o aviso do Boot.
spring.jpa.open-in-view=false

# Domínio aceito no cadastro. O domínio real do CIMATEC ainda não foi confirmado
# (ESPECIFICACAO-TELAS.md, "Login e cadastro"), e inventar um seria pior do que não ter: sem a
# variável APP_EMAIL_DOMINIO o servidor não sobe. Antes, o padrão era exemplo.com, e um deploy
# sem a variável aceitaria cadastro de qualquer @exemplo.com.
app.email.dominio=${APP_EMAIL_DOMINIO}

# Verificação do e-mail: o link vale 24 horas (ESPECIFICACAO-TELAS.md, "Verificar e-mail") e
# só dá para pedir outro depois de 60 segundos. Formato de Duration: 24h, 60s, PT5M.
app.verificacao.validade=24h
app.verificacao.intervalo-reenvio=60s
# Conta que nunca confirmou é apagada 7 dias depois de o link vencer (LimpezaDePendentes).
app.verificacao.apagar-pendente-depois=7d

# Cookie de sessão (JSESSIONID). HttpOnly: o JavaScript não lê o cookie, então um XSS não rouba
# a sessão. SameSite=Lax: o navegador não manda o cookie em POST vindo de outro site (segunda
# barreira contra CSRF, além do token; e como front e API ficam na mesma origem, toda chamada
# legítima parte do próprio site e o cookie sempre viaja nelas). Secure: só viaja por HTTPS.
# Ligado aqui; só o perfil dev desliga, porque em http pelo IP da rede o navegador descartaria
# o cookie e o login morreria. A sessão expira depois de 30 minutos sem uso; o logout é explícito.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Endereço de quem fez o pedido quando há um proxy na frente (DECISOES.md, 2026-09-27, I1).
# "native" liga o RemoteIpValve do Tomcat: ele só lê o X-Forwarded-For (e o X-Forwarded-Proto)
# quando a conexão vem de um proxy CONFIÁVEL, e aí pega o endereço mais à direita que não seja
# de proxy. Conexão direta de fora tem o header ignorado, então ninguém escreve o IP que quiser.
# Confiáveis, por padrão: as faixas privadas (10/8, 172.16/12, 192.168/16, 127/8 e outras).
# Nunca usar "framework": ele aceita o header de qualquer um e o limite por origem deixa de existir.
server.forward-headers-strategy=native

# Limite de tentativas de login (DECISOES.md, 2026-09-27).
# Por conta, o controle principal: 5 tentativas em 15 minutos; passou, bloqueia por 15 minutos.
# Não depende de endereço, então vale igual atrás de proxy ou de NAT.
app.login.limite-por-conta=5
app.login.janela=15m
app.login.bloqueio=15m
# Por origem (IP; IPv6 por bloco /64), só um freio contra quem testa uma senha em muitas contas:
# 50 tentativas em 5 minutos, bloqueio de 5 minutos. Folgado de propósito: atrás de um NAT (a rede
# da escola) ou de um proxy, muita gente divide o mesmo IP, e antes 20 senhas erradas de qualquer
# pessoa trancavam o login de todos por 15 minutos. Login certo devolve a tentativa à origem.
app.login.limite-por-origem=50
app.login.janela-origem=5m
app.login.bloqueio-origem=5m

# Limite por origem nas outras rotas públicas: cadastro, verificação e reenvio contam juntos.
# 100 pedidos em 5 minutos, bloqueio de 5 minutos. Uma turma de 40 atrás do mesmo NAT, cadastrando
# e verificando ao mesmo tempo, faz uns 80. Por origem, o BCrypt do cadastro fica em uns 4% de um
# núcleo, e o reenvio para a mesma pessoa fica preso também ao intervalo por e-mail.
app.rotas-publicas.limite-por-origem=100
app.rotas-publicas.janela=5m
app.rotas-publicas.bloqueio=5m

# Teto de cada mapa dos limites em memória (login por conta, login por origem, rotas públicas
# por origem, intervalo de reenvio): no máximo 10 mil chaves cada. Cheio, sai a chave não bloqueada que ninguém usa há
# mais tempo (ver Contador). A conta de memória está no DECISOES.md, 2026-09-27.
app.limites.teto=10000

# Tamanho máximo do corpo JSON: 16 KB. O maior pedido legítimo (o cadastro) tem menos de 1 KB.
# Sem isto não há limite: o Jackson aceita texto de até 100 MB por campo e lê o corpo inteiro
# para a memória ANTES de o @Size de cada campo ser conferido. Alguns pedidos gigantes ao mesmo
# tempo bastariam para derrubar o servidor. Com o limite, o Jackson para de ler no meio e a
# resposta é 400 (revisão de segurança de 2026-09-27, D5).
spring.jackson.factory.constraints.read.max-document-length=16384
